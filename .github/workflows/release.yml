name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unit tests
        run: swift test

      - name: Install transmission-daemon
        run: brew install transmission-cli

      # CI passing on a push doesn't prove this tagged commit was the one tested.
      - name: Integration tests
        run: ./Scripts/integration-test.sh

      - name: Build app and disk image
        run: ./Scripts/build-app.sh --dmg --version "${GITHUB_REF_NAME}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.dmg

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Unit tests
        run: swift test

      - name: Install transmission-daemon
        run: brew install transmission-cli

      # CI passing on a push doesn't prove this tagged commit was the one tested.
      - name: Integration tests
        run: ./Scripts/integration-test.sh

      - name: Build app and disk image
        run: ./Scripts/build-app.sh --dmg --version "${TAG}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            dist/*.dmg

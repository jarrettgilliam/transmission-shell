name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Install transmission-daemon
        run: brew install transmission-cli

      # The only check that the 409 handshake still matches a real daemon, rather than
      # matching our own assumptions about it.
      - name: Integration tests
        run: ./Scripts/integration-test.sh

      - name: Build app bundle
        run: ./Scripts/build-app.sh
